[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchpilot"
version = "0.1.2"
description = "LLM-driven AutoML for tabular PyTorch models via Ollama Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harshvardhan Bhanot" }]
keywords = ["automl", "pytorch", "tabular", "ollama", "llm", "neural-network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "ollama>=0.4",
    "pydantic>=2.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/hvbhanot/TorchPilot"
Issues = "https://github.com/hvbhanot/TorchPilot/issues"

[tool.setuptools.packages.find]
include = ["torchpilot*"]
